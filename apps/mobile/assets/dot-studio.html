<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Dot Characters</title>
<style>
:root{
  --bg:#F6F4EF;
  --panel:#FFFFFF;
  --ink:#1B1B1D;
  --ink-2:#3A3935;
  --muted:#77736B;
  --faint:#A29D93;
  --line:#E4E0D6;
  --line-2:#D6D1C5;
  --tile:#EFECE6;
  --tile-2:#E7E3DB;
  --stage-top:#F3F1EC;
  --stage-bottom:#E2DED5;
  --focus:#5B7A4C;
  --radius-lg:28px;
  --radius-md:18px;
  --radius-sm:12px;
  --shadow-1:0 1px 2px rgba(28,26,22,.06),0 6px 20px -8px rgba(28,26,22,.12);
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans","Noto Sans","Noto Sans CJK SC","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans Thai",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- header ---------- */
.top{max-width:1360px;margin:0 auto;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;letter-spacing:-.01em;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{position:relative;display:flex;align-items:center;gap:8px;height:38px;padding:0 12px 0 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink-2)}
.lang svg.i{width:16px;height:16px;color:var(--muted)}
.lang select{appearance:none;-webkit-appearance:none;border:0;background:transparent;padding:0 18px 0 0;font-size:13px;font-weight:550;max-width:200px;cursor:pointer}
.lang .chev{position:absolute;inset-inline-end:10px;pointer-events:none;width:14px;height:14px;color:var(--muted)}
.lang select:focus-visible{outline:none}
.lang:focus-within{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- layout ---------- */
.app{max-width:1360px;margin:0 auto;padding:4px 28px 40px;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);gap:40px;align-items:start}
.stage-col{position:sticky;top:16px}
.stage{position:relative;border-radius:var(--radius-lg);overflow:hidden;background:linear-gradient(180deg,var(--stage-top),var(--stage-bottom));height:min(calc(100vh - 110px),800px);min-height:520px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);touch-action:pan-y}
.stage canvas.gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.stage canvas.gl:active{cursor:grabbing}
.stage-tools{position:absolute;top:16px;inset-inline-end:16px;display:flex;gap:8px;z-index:2}
.tool{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink-2);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 1px 3px rgba(0,0,0,.08);transition:background .15s,transform .15s}
.tool:hover{background:#fff;transform:translateY(-1px)}
.tool{position:relative}
.tool:active{transform:scale(.92)}
.tool[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translate(-50%,-4px);padding:5px 9px;border-radius:8px;background:rgba(27,27,29,.9);color:#fff;font-size:12px;font-weight:550;line-height:1.3;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.tool[data-tip]:last-child::after{left:auto;right:0;transform:translate(0,-4px)}
.tool[data-tip]:hover::after,.tool[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0)}
.tool[data-tip]:last-child:hover::after,.tool[data-tip]:last-child:focus-visible::after{transform:translate(0,0)}
@media (hover:none){.tool[data-tip]::after{display:none}}
.flash{position:absolute;inset:0;z-index:3;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
.toast{position:absolute;left:50%;top:70px;z-index:4;display:flex;align-items:center;gap:6px;padding:8px 14px 8px 11px;border-radius:999px;background:rgba(27,27,29,.9);color:#fff;font-size:13px;font-weight:600;white-space:nowrap;opacity:0;transform:translate(-50%,-6px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg.i{width:16px;height:16px}
.tool[aria-pressed="true"]{background:var(--ink);color:#fff}
.stage-tag{position:absolute;top:22px;inset-inline-start:22px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);z-index:2}
.stage-tag i{width:7px;height:7px;border-radius:50%;background:#6FAE72;box-shadow:0 0 0 3px rgba(111,174,114,.18)}
.stage-foot{position:absolute;inset-inline:16px;bottom:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;z-index:2;pointer-events:none}
.caption{pointer-events:auto;display:flex;flex-direction:column;gap:2px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 3px rgba(0,0,0,.06);min-width:0;max-width:72%}
.caption strong{font-size:15px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caption span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dice{pointer-events:auto;display:flex;align-items:center;gap:8px;height:46px;padding:0 18px 0 14px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;box-shadow:0 8px 20px -8px rgba(0,0,0,.45);transition:transform .15s,background .15s}
.dice:hover{background:#34332F;transform:translateY(-1px)}
.dice svg.i{width:18px;height:18px}
.hint{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;opacity:.9;pointer-events:none;z-index:1;transition:opacity .6s}
.hint.gone{opacity:0}
.hint svg.i{width:14px;height:14px}
.busy{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s;z-index:1}
.busy.on{opacity:1}
.busy b{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.08);border-top-color:var(--ink-2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:32px;text-align:center;color:var(--muted);font-size:14px}
.nogl .dot{width:160px;height:150px;border-radius:48% 52% 46% 54%/55% 55% 45% 45%;margin:0 auto 20px;box-shadow:inset -14px -18px 30px rgba(0,0,0,.12),inset 12px 14px 24px rgba(255,255,255,.35)}

/* ---------- panel ---------- */
.panel{min-width:0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;padding:5px;border-radius:18px;background:var(--tile)}
.step-btn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 12px 10px;border-radius:13px;text-align:start;min-width:0;transition:background .15s,box-shadow .15s}
.step-btn:hover{background:rgba(255,255,255,.55)}
.step-btn[aria-current="step"]{background:var(--panel);box-shadow:var(--shadow-1)}
.step-btn small{font-size:11px;color:var(--faint);font-weight:650;display:flex;align-items:center;gap:6px;letter-spacing:.02em}
.step-btn b{font-size:13.5px;font-weight:650;color:var(--ink-2)}
.step-btn em{font-style:normal;font-size:12px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-btn .sw{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.card{background:var(--panel);border-radius:22px;padding:20px 18px 18px;box-shadow:var(--shadow-1)}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 4px 14px}
.card-head h2{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em}
.card-head span{font-size:12px;color:var(--muted)}
.card-head.has-seg{align-items:center;margin-top:-4px}
.seg{display:inline-flex;flex:none;gap:4px;padding:4px;border-radius:999px;background:var(--tile)}
.seg-btn{height:32px;padding:0 18px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.seg-btn:hover{color:var(--ink-2)}
.seg-btn[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-1)}
.group-title{margin:18px 4px 10px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.group-title:first-child{margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;border-radius:var(--radius-md);padding:0 0 4px}
.opt .thumb{position:relative;width:100%;aspect-ratio:1;border-radius:var(--radius-md);background:linear-gradient(180deg,var(--stage-top),var(--stage-bottom));overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.035);transition:transform .18s,box-shadow .18s}
.opt .thumb canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .25s}
.opt .thumb canvas.ready{opacity:1}
.opt .thumb .ph{position:absolute;left:50%;top:52%;width:44%;aspect-ratio:1.08;transform:translate(-50%,-50%);border-radius:50%;background:rgba(0,0,0,.05)}
.opt:hover .thumb{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 8px 18px -10px rgba(0,0,0,.3)}
.opt[aria-pressed="true"] .thumb{box-shadow:inset 0 0 0 2px var(--ink),0 8px 18px -12px rgba(0,0,0,.35)}
.opt .lbl{font-size:12.5px;line-height:1.25;color:var(--ink-2);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.opt[aria-pressed="true"] .lbl{color:var(--ink);font-weight:650}
.badge{position:absolute;top:7px;inset-inline-end:7px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:none;place-items:center}
.badge svg.i{width:13px;height:13px;stroke-width:2.6}
.opt[aria-pressed="true"] .badge{display:grid}

/* colors */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:12px 8px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;padding:2px 0}
.chip{position:relative;width:46px;height:46px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),inset -5px -7px 12px rgba(0,0,0,.14),inset 5px 6px 10px rgba(255,255,255,.35);transition:transform .15s}
.chip::after{content:"";position:absolute;top:8px;left:11px;width:13px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(1.5px);transform:rotate(-24deg)}
.swatch:hover .chip{transform:scale(1.06)}
.swatch[aria-pressed="true"] .chip{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--ink),inset -5px -7px 12px rgba(0,0,0,.14),inset 5px 6px 10px rgba(255,255,255,.35)}
.swatch .lbl{font-size:12px;color:var(--ink-2);text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatch[aria-pressed="true"] .lbl{font-weight:650;color:var(--ink)}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:550;color:var(--ink-2);transition:background .15s,border-color .15s}
.pill:hover{background:var(--tile);border-color:var(--line-2)}
.pill[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill svg.i{width:15px;height:15px}
.pill .mini{width:14px;height:14px;border-radius:50%;background:conic-gradient(from 90deg,#e8645a,#eab54a,#9cc26a,#4fb3a3,#4e7fd1,#9a6fd0,#e36aa4,#e8645a)}
.tone{aspect-ratio:1;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .12s}
.tone:hover{transform:scale(1.15)}
.tone[aria-pressed="true"]{box-shadow:0 0 0 2px var(--tile),0 0 0 3.5px var(--ink)}
.custom{margin-top:14px;padding:16px;border-radius:16px;background:var(--tile);display:grid;grid-template-columns:auto 1fr;gap:14px 16px;align-items:center}
.custom .preview{width:64px;height:64px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),inset -6px -8px 14px rgba(0,0,0,.16),inset 6px 7px 12px rgba(255,255,255,.35)}
.hexrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hexin{display:flex;align-items:center;height:36px;border:1px solid var(--line-2);border-radius:10px;background:#fff;padding:0 10px;gap:4px;direction:ltr}
.hexin span{color:var(--faint);font-family:var(--mono);font-size:13px}
.hexin input{width:78px;border:0;outline:0;background:transparent;font-family:var(--mono);font-size:13.5px;text-transform:uppercase;letter-spacing:.04em}
.hexin:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.sliders{grid-column:1/-1;display:grid;gap:12px}
.slider{display:grid;grid-template-columns:86px 1fr 44px;gap:12px;align-items:center;font-size:12.5px;color:var(--muted)}
.slider output{font-family:var(--mono);font-size:12px;text-align:end;color:var(--ink-2)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:999px;background:var(--track,#ddd);outline-offset:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);direction:ltr}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.2);cursor:grab}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 1px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.2);cursor:grab}
.native{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}

/* actions */
.actions{position:sticky;bottom:0;z-index:5;margin-top:14px;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(246,244,239,0),var(--bg) 30%);display:flex;gap:10px}
.btn{height:50px;border-radius:14px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:620;font-size:14.5px;transition:background .15s,transform .15s,border-color .15s}
.btn svg.i{width:18px;height:18px}
.btn.primary{flex:1;background:var(--ink);color:#fff;box-shadow:0 10px 24px -14px rgba(0,0,0,.6)}
.btn.primary:hover{background:#34332F}
.btn.ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--line-2);background:#FBFAF7}
[dir=rtl] .flip{transform:scaleX(-1)}
.note{margin:4px 2px 0;font-size:12px;color:var(--faint);line-height:1.6}
footer{max-width:1360px;margin:0 auto;padding:18px 28px 36px;display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--faint);border-top:1px solid var(--line)}

/* dialog */
dialog{width:min(680px,calc(100% - 28px));max-height:calc(100vh - 40px);border:0;border-radius:24px;padding:0;background:var(--panel);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(30,28,24,.36);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.dlg{display:grid;grid-template-columns:240px 1fr;min-height:0}
.dlg-art{background:linear-gradient(180deg,var(--stage-top),var(--stage-bottom));display:grid;place-items:center;padding:18px}
.dlg-art img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px}
.dlg-body{padding:24px 24px 20px;min-width:0;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:calc(100vh - 40px)}
.dlg-body h2{margin:0;font-size:21px;letter-spacing:-.015em;padding-inline-end:36px}
.dlg-body p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--tile);font-size:12.5px;color:var(--ink-2)}
.tag i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.dl-opts{display:grid;gap:10px;margin-top:6px}
.dl-opt{display:grid;grid-template-columns:40px minmax(0,1fr) 18px;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--panel);text-align:start;transition:background .15s,border-color .15s}
.dl-opt:hover{border-color:var(--line-2);background:#FBFAF7}
.dl-opt .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--tile);color:var(--ink-2)}
.dl-opt b{display:block;font-size:14.5px;font-weight:650;color:var(--ink)}
.dl-opt small{display:block;margin-top:1px;font-size:12px;color:var(--muted)}
.dl-opt svg.go{width:18px;height:18px;color:var(--faint)}
.dl-opt.primary{background:var(--ink);border-color:var(--ink)}
.dl-opt.primary:hover{background:#34332F}
.dl-opt.primary .ic{background:rgba(255,255,255,.12);color:#fff}
.dl-opt.primary b{color:#fff}
.dl-opt.primary small,.dl-opt.primary svg.go{color:rgba(255,255,255,.66)}
.x{position:absolute;top:14px;inset-inline-end:14px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--tile)}
.x:hover{color:var(--ink)}
.status{min-height:18px;font-size:12.5px;color:#4E7A43}

/* off screen (e.g. the host page is scrolled down): no animation keeps running */
.offscreen *,.offscreen *::before,.offscreen *::after{animation-play-state:paused!important}

/* embed: the studio inside a host page's iframe fills the frame exactly; only the option list scrolls */
.embed body{background:transparent}
.embed .top,.embed footer,.embed .note{display:none}
.embed .app{max-width:none;height:100vh;height:100dvh;padding:0;gap:16px;grid-template-columns:minmax(0,1.18fr) minmax(360px,.82fr);align-items:stretch}
.embed .stage-col{position:relative;top:auto;min-height:0}
.embed .stage{height:100%;min-height:0;max-height:none;aspect-ratio:auto}
.embed .panel{min-height:0;display:flex;flex-direction:column}
.embed .steps{flex:none}
.embed .card{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.embed .actions{position:static;flex:none;margin-top:12px;padding:0;background:none}

/* viewer: the downloaded HTML opens straight into a full-window 3D view of one character */
.viewer .top,.viewer .panel,.viewer footer,.viewer #btn-random{display:none}
.viewer .app{display:block;max-width:none;padding:0}
.viewer .stage-col{position:static}
.viewer .stage{height:100vh;height:100dvh;min-height:0;max-height:none;aspect-ratio:auto;border-radius:0}

/* mark: the same viewer, transparent, with no studio chrome — embedded as an app avatar */
.mark,.mark body{background:transparent}
.mark .stage{background:transparent;box-shadow:none}
.mark .stage-tag,.mark .stage-tools,.mark .hint,.mark .stage-foot,.mark .busy,.mark .toast,.mark .flash{display:none}

/* responsive */
@media (max-width:1100px){.app{grid-template-columns:minmax(0,1fr) minmax(340px,.95fr);gap:28px}}
@media (max-width:860px){
  .top{padding:14px 16px}
  .app{grid-template-columns:1fr;padding:0 16px 24px;gap:18px}
  .stage-col{position:relative;top:auto}
  .stage{height:auto;min-height:0;aspect-ratio:1/1;max-height:66vh;width:100%}
  .steps{gap:4px;padding:4px}
  .step-btn{padding:8px 8px 9px}
  .step-btn em{display:none}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .card{padding:16px 12px 14px}
  .dice span{display:none}
  .dice{width:46px;padding:0;justify-content:center}
  .caption{max-width:calc(100% - 64px)}
  .hint{display:none}
  .caption{padding:9px 12px}
  .caption strong{font-size:14px}
  .lang select{max-width:118px;text-overflow:ellipsis}
  .brand{font-size:15px}
  footer{flex-direction:column;padding:16px}
  .dlg{grid-template-columns:1fr}
  .dlg-art{padding:14px 14px 0;background:none}
  .dlg-art img{width:120px}
}
@media (max-width:860px){
  .embed .app{display:flex;flex-direction:column;gap:10px;padding:0}
  .embed .stage-col{flex:0 0 44%}
  .embed .stage{width:100%}
  .embed .panel{flex:1}
  .embed .steps{margin-bottom:10px}
  .embed .card{overscroll-behavior:auto}   /* on phones a finished list hands the swipe back to the host page */
}
@media (max-width:420px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .slider{grid-template-columns:70px 1fr 40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  <section class="panel">

        <button class="dl-opt" id="dlg-png"></button>

      <div class="status" id="dlg-status" role="status"></div>

</dialog>
