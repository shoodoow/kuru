<!doctype html>
<!-- Shown when the server cannot be reached, and from the menu's Change Server…
     Kuru is open source and people run their own server, so the address can change. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Kuru</title>
    <style>
      :root { color-scheme: light dark; --bg: #fff; --text: #000; --muted: #6e6e73; --field: #f2f2f7; --error: #d70015; }
      @media (prefers-color-scheme: dark) { :root { --bg: #000; --text: #fff; --muted: #8e8e93; --field: #1c1c1e; --error: #ff453a; } }
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 15px -apple-system, "Segoe UI", sans-serif; }
      form { width: 360px; display: grid; gap: 12px; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; color: var(--muted); }
      input { padding: 12px 14px; border: 0; border-radius: 12px; background: var(--field); color: var(--text); font: inherit; }
      button { padding: 12px; border: 0; border-radius: 12px; background: var(--text); color: var(--bg); font: inherit; font-weight: 600; cursor: pointer; }
      .error { color: var(--error); }
    </style>
  </head>
  <body>
    <form id="form">
      <h1>Kuru server</h1>
      <p>The address of the Kuru server to sign in to.</p>
      <p id="error" class="error" hidden></p>
      <input id="server" placeholder="kuru.example.com" autofocus />
      <button type="submit">Connect</button>
    </form>
    <script>
      const query = new URLSearchParams(location.search);
      const field = document.getElementById("server");
      const error = document.getElementById("error");
      field.value = query.get("server") || "";
      function showError(text) {
        error.textContent = text;
        error.hidden = !text;
      }
      showError(query.get("error"));
      document.getElementById("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const result = await window.kuruDesktop.setServer(field.value);
        if (!result.ok) showError(result.error || "That address did not work.");
      });
    </script>
  </body>
</html>
