# Full setup: deploy/SETUP.md
# Copy to ~/.cloudflared/config.yml (or: cloudflared tunnel --config /path/to/config.yml run kuru)
# credentials-file must point at the JSON from `cloudflared tunnel create`.
tunnel: kuru
credentials-file: /path/to/.cloudflared/<TUNNEL-UUID>.json

ingress:
  - hostname: api.example.com
    service: http://127.0.0.1:3000
  - service: http_status:404
